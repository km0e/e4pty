name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Full runtime test suite on the three first-class platforms.
  # macOS here is the sanctioned way to run the pty backend on Darwin
  # (Docker cannot containerize macOS; see README "Testing").
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hanging test must not burn the 6h runner default (observed on
    # Windows in run 34199047984); 20 minutes is ample for the suite.
    timeout-minutes: 20
    env:
      E4PTY_DEBUG: "1" # backend lifecycle tracing on stderr (windows.rs)
    defaults:
      run:
        # Git Bash on the Windows runner puts `sh.exe` on PATH, which the
        # shell-script tests resolve via SearchPathW.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Serial + --nocapture: failures print inline at the exact test
      # instead of after the whole binary finishes (which never happens
      # when a test hangs).
      - run: cargo test --all-targets --no-fail-fast -- --test-threads=1 --nocapture

  # Minimum Supported Rust Version (edition 2024 floor).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps

  # Compile-level adaptation checks for every supported target.
  # `cargo check` needs no linker/SDK for these (incl. darwin/msvc).
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --target ${{ matrix.target }}
