[package]
name = "e4pty"
version = "0.3.1"
edition = "2024"
authors = ["km0e <kmdr.error@gmail.com>"]
repository = "https://github.com/km0e/e4pty.git"
description = "abstract api for pty"
license = "MIT"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.51", features = ["process", "rt", "sync", "net", "io-util"] }
tracing = "0.1"

[target.'cfg(not(windows))'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }
rustix-openpty = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
